# Build Umbraco CMS image and publish to GitHub Container Registry (public).
name: Umbraco CMS container

on:
  push:
    branches:
      - main
    paths:
      - "src/umbraco/**"
      - ".github/workflows/umbraco-container.yml"
  pull_request:
    paths:
      - "src/umbraco/**"
      - ".github/workflows/umbraco-container.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: monitoring-demo-umbraco

permissions:
  contents: read
  packages: write

concurrency:
  group: monitoring-demo-umbraco-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v6

      - id: login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: src/umbraco
          file: src/umbraco/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - id: publish_public
        name: Set GHCR package visibility to public
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.repository.owner.type }}" = "Organization" ]; then
            gh api --method PATCH -f visibility=public \
              "/orgs/${{ github.repository_owner }}/packages/container/${PACKAGE}"
          else
            gh api --method PATCH -f visibility=public \
              "/user/packages/container/${PACKAGE}"
          fi
