# Template only — do not apply with placeholders. CI creates demo-umbraco-secret from GitHub Secrets.
# Manual: kubectl apply -f secret.yaml -n <namespace> after replacing values, or use workflow deploy.
apiVersion: v1
kind: Secret
metadata:
  name: demo-umbraco-secret
  labels:
    app.kubernetes.io/name: demo-umbraco
    app.kubernetes.io/component: cms
    app.kubernetes.io/part-of: demo-monitoring
type: Opaque
stringData:
  # In-cluster SQL (namespace sqlserver). Password must match mssql2025-secret.
  ConnectionStrings__umbracoDbDSN: "Server=mssql2025.sqlserver.svc.cluster.local,1433;Database=Umbraco;User Id=sa;Password=REPLACE_SA_PASSWORD;TrustServerCertificate=True;Encrypt=True"
