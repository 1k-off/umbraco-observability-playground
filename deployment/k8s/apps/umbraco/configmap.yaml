apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-umbraco-config
  labels:
    app.kubernetes.io/name: demo-umbraco
    app.kubernetes.io/component: cms
    app.kubernetes.io/part-of: demo-monitoring
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://0.0.0.0:8080"
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  Umbraco__CMS__Global__UseHttps: "false"
  Umbraco__CMS__Global__DefaultUILanguage: "en-US"
  Umbraco__CMS__WebRouting__UmbracoApplicationUrl: "https://demo-cms.1node.tech/"
  # Demo load / article flags (default off). Enable for antipattern A/D runs:
  # Demo__NaiveArticlesEndpoint: "true"   # N+1 GET /umbraco/api/demo/articles-naive
  # Demo__SlowEndpoint: "true"            # GET /umbraco/api/demo/slow
  Demo__NaiveArticlesEndpoint: "false"
  Demo__SlowEndpoint: "false"
  Demo__FaultEndpoint: "false"
  # Pyroscope native profiler — only process env (not appsettings)
  CORECLR_ENABLE_PROFILING: "1"
  CORECLR_PROFILER: "{BD1A650D-AC5D-4896-B64F-D6FA25D6B26A}"
  CORECLR_PROFILER_PATH: "/app/Pyroscope.Profiler.Native.so"
  LD_PRELOAD: "/app/Pyroscope.Linux.ApiWrapper.x64.so"
  PYROSCOPE_PROFILING_ENABLED: "1"
  PYROSCOPE_APPLICATION_NAME: "umbraco-cms"
  PYROSCOPE_SERVER_ADDRESS: "http://pyroscope.observability.svc.cluster.local:4040"
  PYROSCOPE_FORMAT: "jfr"
