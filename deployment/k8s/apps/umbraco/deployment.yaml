apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-umbraco
  labels:
    app.kubernetes.io/name: demo-umbraco
    app.kubernetes.io/component: cms
    app.kubernetes.io/part-of: demo-monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-umbraco
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-umbraco
        app.kubernetes.io/component: cms
        app.kubernetes.io/part-of: demo-monitoring
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: demo-umbraco
          image: ghcr.io/1k-off/monitoring-demo-umbraco:0.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: demo-umbraco-config
            - secretRef:
                name: demo-umbraco-secret
          volumeMounts:
            - name: umbraco-data
              mountPath: /app/wwwroot/media
              subPath: media
            - name: umbraco-data
              mountPath: /app/umbraco/Data
              subPath: data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: umbraco-data
          persistentVolumeClaim:
            claimName: demo-umbraco-data
