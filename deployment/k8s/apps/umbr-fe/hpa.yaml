apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demo-umbr-fe
  labels:
    app.kubernetes.io/name: demo-umbr-fe
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: demo-monitoring
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-umbr-fe
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
