apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: demo-umbr-fe
  labels:
    app.kubernetes.io/name: demo-umbr-fe
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: demo-monitoring
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`demo-umbr-fe.1node.tech`)
      kind: Rule
      services:
        - name: demo-umbr-fe
          port: 3000
