apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-umbr-fe-config
  labels:
    app.kubernetes.io/name: demo-umbr-fe
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: demo-monitoring
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  # BFF + SSR fetch (public CMS URL — media URLs in HTML must be browser-reachable)
  CMS_BASE_URL: "https://demo-cms.1node.tech"
  NEXT_PUBLIC_SITE_URL: "https://demo-umbr-fe.1node.tech"
  FARO_COLLECTOR_URL: "https://demo-umbr-fe.1node.tech/api/faro"
  NEXT_PUBLIC_DEPLOYMENT_ENVIRONMENT: "demo"
  OTEL_SERVICE_NAME: "umbraco-web"
  OTEL_DEPLOYMENT_ENVIRONMENT: "demo"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy-gateway.observability.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  FARO_COLLECTOR_UPSTREAM: "http://alloy-gateway.observability.svc.cluster.local:12347"
  PYROSCOPE_SERVER_ADDRESS: "http://pyroscope.observability.svc.cluster.local:4040"
