apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-umbr-fe
  labels:
    app.kubernetes.io/name: demo-umbr-fe
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: demo-monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-umbr-fe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-umbr-fe
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: demo-monitoring
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: demo-umbr-fe
          image: ghcr.io/1k-off/monitoring-demo-umbr-fe:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: demo-umbr-fe-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
