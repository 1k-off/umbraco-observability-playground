# Replace SA_PASSWORD before applying. Do not commit real passwords.
# Or: kubectl create secret generic mssql2025-secret -n sqlserver --from-literal=SA_PASSWORD='...' --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: mssql2025-secret
  namespace: sqlserver
  labels:
    app.kubernetes.io/name: mssql2025
    app.kubernetes.io/component: database
type: Opaque
stringData:
  SA_PASSWORD: "REPLACE_BEFORE_APPLY"
