# Grafana Alloy — DaemonSet for node/pod discovery (placeholder until Phase 5).
# Install: helm upgrade --install alloy grafana/alloy -n observability -f values-alloy-daemonset.yaml

nameOverride: alloy
fullnameOverride: alloy

controller:
  type: daemonset

service:
  enabled: false

serviceMonitor:
  enabled: false

alloy:
  stabilityLevel: generally-available
  clustering:
    enabled: false
  configMap:
    create: true
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["demo-services", "observability"]
        }
      }

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
