# Replace credentials before applying. Do not commit real keys.
# Or:
#   kubectl create secret generic minio-credentials -n observability \
#     --from-literal=MINIO_ROOT_USER='...' \
#     --from-literal=MINIO_ROOT_PASSWORD='...' \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: observability
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/part-of: demo-monitoring
type: Opaque
stringData:
  MINIO_ROOT_USER: "REPLACE_MINIO_ACCESS_KEY"
  MINIO_ROOT_PASSWORD: "REPLACE_MINIO_SECRET_KEY"
