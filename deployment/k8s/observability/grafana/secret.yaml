# Replace password before applying. Do not commit real credentials.
# Or:
#   kubectl create secret generic grafana-admin -n observability \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password='...' \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: demo-monitoring
type: Opaque
stringData:
  admin-user: admin
  admin-password: "REPLACE_GRAFANA_ADMIN_PASSWORD"
