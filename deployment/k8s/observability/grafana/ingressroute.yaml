apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: demo-grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: demo-monitoring
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`demo-grafana.1node.tech`)
      kind: Rule
      services:
        - name: grafana
          port: 80
