# OpenMaxIO Console — session encryption (generate random values; do not commit).
# Or:
#   kubectl create secret generic openmaxio-console -n observability \
#     --from-literal=CONSOLE_PBKDF_PASSPHRASE='...' \
#     --from-literal=CONSOLE_PBKDF_SALT='...' \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: openmaxio-console
  namespace: observability
  labels:
    app.kubernetes.io/name: openmaxio
    app.kubernetes.io/component: object-storage-ui
    app.kubernetes.io/part-of: demo-monitoring
type: Opaque
stringData:
  CONSOLE_PBKDF_PASSPHRASE: "REPLACE_OPENMAXIO_PASSPHRASE"
  CONSOLE_PBKDF_SALT: "REPLACE_OPENMAXIO_SALT"
