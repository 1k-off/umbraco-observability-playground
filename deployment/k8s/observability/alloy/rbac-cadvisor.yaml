# Extra RBAC so Alloy DaemonSet can scrape kubelet cAdvisor via API proxy.
# Apply after Alloy helm install (binds to SA alloy from the chart).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-cadvisor
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: demo-monitoring
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-cadvisor
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: demo-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-cadvisor
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: observability
